include:
  - remote: 'https://gitlab.com/cscs-ci/recipes/-/raw/master/templates/v2/.ci-ext.yml'

.test/base:
  stage: test
  image: ${UENV_NAME}/${UENV_VERSION}:${UENV_TAG}
  variables:
    WITH_UENV_VIEW: "default"
  script:
    - export BUILD_DIR="/capstor/store/cscs/pasc/c36/ci-stack/$CI_PIPELINE_ID"
    - ls -d "$BUILD_DIR"/tmlqcd/spack-build-* "$BUILD_DIR"/quda/spack-build-*   # sanity check
    - bindir=$(echo "$BUILD_DIR"/tmlqcd/spack-build-*/src/bin)
    - libdir=$(dirname $(echo "$BUILD_DIR"/quda/spack-build-*/lib/libquda.so))
    - export PATH="${bindir}:$PATH"
    - export LD_LIBRARY_PATH="${libdir}:${LD_LIBRARY_PATH:-}"
    - ctest --test-dir "$BUILD_DIR"/tmlqcd/spack-build-*
